name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (leave empty to use current date, e.g. vYYYY.MM.DD)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libpcre2-dev verilator

      - name: Determine release tag
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Date-based tag (CalVer: vYYYY.MM.DD)
            DATE_TAG="v$(date +'%Y.%m.%d')"
            git fetch --tags --force 2>/dev/null || true
            if git rev-parse "$DATE_TAG" >/dev/null 2>&1; then
              COUNT=1
              while git rev-parse "${DATE_TAG}.${COUNT}" >/dev/null 2>&1; do
                COUNT=$((COUNT + 1))
              done
              TAG="${DATE_TAG}.${COUNT}"
            else
              TAG="$DATE_TAG"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Configure Release build
        run: cmake --preset release

      - name: Build Release binary
        run: cmake --build --preset release --parallel 2

      - name: Run test suite
        run: ctest --preset release --output-on-failure

      - name: Install binary to staging directory
        run: cmake --install build/release --prefix "$RUNNER_TEMP/slip"

      - name: Smoke test installed binary
        run: |
          "$RUNNER_TEMP/slip/bin/slip" --version
          "$RUNNER_TEMP/slip/bin/slip" check tests/fixtures/simple.slip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package VS Code extension
        working-directory: editors/vscode
        run: >-
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies
          --out "$GITHUB_WORKSPACE/slip-language-${{ steps.vars.outputs.tag }}.vsix"

      - name: Package release archive
        id: package
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          DIST_NAME="slip-${TAG}-linux-x86_64"
          DIST_DIR="$RUNNER_TEMP/${DIST_NAME}"
          EDITORS_NAME="slip-editors-${TAG}"
          EDITORS_DIR="$RUNNER_TEMP/${EDITORS_NAME}"
          mkdir -p "${DIST_DIR}/bin" "${DIST_DIR}/share/slip" "$EDITORS_DIR"

          cp "$RUNNER_TEMP/slip/bin/slip" "$RUNNER_TEMP/slip/bin/slip-lsp" "${DIST_DIR}/bin/"
          strip "${DIST_DIR}/bin/slip"
          cp LICENSE README.md README_CN.md "${DIST_DIR}/"
          cp -R editors docs examples "${DIST_DIR}/share/slip/"
          cp -R editors/. "$EDITORS_DIR/"
          cp LICENSE "$EDITORS_DIR/"
          cp docs/tex/user-manual.pdf user-manual.pdf

          tar --exclude=__pycache__ --exclude='*.pyc' --exclude='*.vsix' \
            -czf "${DIST_NAME}.tar.gz" -C "$RUNNER_TEMP" "${DIST_NAME}"
          tar --exclude=__pycache__ --exclude='*.pyc' --exclude='*.vsix' \
            -czf "${EDITORS_NAME}.tar.gz" -C "$RUNNER_TEMP" "${EDITORS_NAME}"
          sha256sum "${DIST_NAME}.tar.gz" > "${DIST_NAME}.tar.gz.sha256"
          sha256sum "${DIST_NAME}.tar.gz" "${EDITORS_NAME}.tar.gz" \
            "slip-language-${TAG}.vsix" user-manual.pdf > SHA256SUMS.txt

          echo "archive=${DIST_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=${DIST_NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "editors=${EDITORS_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "vsix=slip-language-${TAG}.vsix" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Slip ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sha256 }}
            ${{ steps.package.outputs.editors }}
            ${{ steps.package.outputs.vsix }}
            user-manual.pdf
            SHA256SUMS.txt
