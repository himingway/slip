name: Compiler checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cpp:
    name: C++ / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libpcre2-dev verilator
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
      - run: cmake --install build/${{ matrix.preset }} --prefix "$RUNNER_TEMP/slip"
      - run: '"$RUNNER_TEMP/slip/bin/slip" check tests/fixtures/simple.slip'

  reference:
    name: Python reference and C++ parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cmake libpcre2-dev verilator
      - run: python -m pip install -e reference/python 'pytest>=9.0.3'
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel 2
      - run: python -m pytest -q reference/python/tests reference/python/migration
        env:
          SLIP_BIN: ${{ github.workspace }}/build/release/slip
