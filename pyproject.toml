[project]
name = "slip-hdl"
version = "0.1.0"
description = "A minimal hardware description language DSL compiler targeting SystemVerilog"
requires-python = ">=3.10"
dependencies = [
    "pyslang>=10.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
slip = "slip.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slip"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
